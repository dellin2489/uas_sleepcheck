{% extends "base.html" %}

{% block title %}Prediksi{% endblock %}

{% block content %}

<div class="card">

    <h1>Prediksi Gangguan Tidur</h1>

    {% if errors %}

    <div class="error-box">

        <ul>
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>

    </div>

    {% endif %}


    <form
        id="predict-form"
        method="post"
        action="/predict"
    >

        <label>Nama</label>

        <input
            type="text"
            name="nama"
            minlength="2"
            maxlength="100"
            required
            value="{{ values.get('nama', '') }}"
        >


        <label>Age</label>

        <input
            type="number"
            name="age"
            min="1"
            max="100"
            required
            value="{{ values.get('age', '') }}"
        >


        <label>Gender</label>

        <select name="gender" required>

            <option value="">
                Pilih Gender
            </option>

            <option value="Male"
                {% if values.get('gender') == 'Male' %}
                selected
                {% endif %}
            >
                Male
            </option>

            <option value="Female"
                {% if values.get('gender') == 'Female' %}
                selected
                {% endif %}
            >
                Female
            </option>

        </select>


        <label>BMI Category</label>

        <select name="bmi_category" required>

            <option value="">
                Pilih BMI
            </option>

            <option value="Normal"
                {% if values.get('bmi_category') == 'Normal' %}
                selected
                {% endif %}
            >
                Normal
            </option>

            <option value="Overweight"
                {% if values.get('bmi_category') == 'Overweight' %}
                selected
                {% endif %}
            >
                Overweight
            </option>

            <option value="Obese"
                {% if values.get('bmi_category') == 'Obese' %}
                selected
                {% endif %}
            >
                Obese
            </option>

        </select>


        <label>Sleep Duration (jam)</label>

        <input
            type="number"
            name="sleep_duration"
            min="1"
            max="24"
            step="0.1"
            required
            value="{{ values.get('sleep_duration', '') }}"
        >


        <label>Physical Activity (menit/hari)</label>

        <input
            type="number"
            name="physical_activity"
            min="0"
            max="500"
            required
            value="{{ values.get('physical_activity', '') }}"
        >


        <label>Stress Level</label>

        <input
            type="number"
            name="stress_level"
            min="1"
            max="10"
            required
            value="{{ values.get('stress_level', '') }}"
        >


        <label>Heart Rate</label>

        <input
            type="number"
            name="heart_rate"
            min="30"
            max="220"
            required
            value="{{ values.get('heart_rate', '') }}"
        >


        <label>Daily Steps</label>

        <input
            type="number"
            name="daily_steps"
            min="0"
            max="100000"
            required
            value="{{ values.get('daily_steps', '') }}"
        >


        <label>Systolic</label>

        <input
            type="number"
            name="systolic"
            min="60"
            max="250"
            required
            value="{{ values.get('systolic', '') }}"
        >


        <label>Diastolic</label>

        <input
            type="number"
            name="diastolic"
            min="30"
            max="150"
            required
            value="{{ values.get('diastolic', '') }}"
        >


        <button
            type="submit"
            id="submit-button"
        >
            Prediksi
        </button>

    </form>

</div>

{% endblock %}

{% block scripts %}

<script src="/static/predict.js"></script>

{% endblock %}
