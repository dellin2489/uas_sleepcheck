<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SleepCheck{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-inner">
            <a class="brand" href="/">SleepCheck</a>
            <nav class="nav-links">
                <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Home</a>
                <a href="/predict" {% if request.url.path == '/predict' %}class="active"{% endif %}>Prediksi</a>
                <a href="/history" {% if request.url.path.startswith('/history') %}class="active"{% endif %}>Riwayat</a>
                <a href="/contact" {% if request.url.path == '/contact' %}class="active"{% endif %}>Contact Us</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>SleepCheck &copy; 2026 &middot; UAS Pemrograman Web Framework Python</p>
            <p class="muted">Hasil analisis adalah screening awal, bukan diagnosis medis.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
